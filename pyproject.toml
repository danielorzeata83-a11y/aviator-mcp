[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aviator-mcp-unofficial"
version = "0.1.2"
description = "Unofficial MCP server for the Aviator MergeQueue REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.0", "httpx>=0.27", "pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
aviator-mcp = "aviator_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aviator_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["*/aviator_mcp/demo.py"]  # simulated data; exercised by eval/ and tests/test_demo.py
